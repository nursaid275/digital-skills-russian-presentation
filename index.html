<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080d1b"><title>Цифровые навыки — технофестиваль</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700&display=swap');
:root{--bg:#080d1b;--panel:#111a2e;--ink:#f6f7fb;--muted:#bbc5d8;--gold:#ffc04f;--amber:#ff8d2d}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(ellipse at 75% 12%,#19264a,transparent 38%),linear-gradient(135deg,#070b16,#0a1122 60%,#080d1b);color:var(--ink);font-family:Manrope,Arial,sans-serif}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.15;background-image:linear-gradient(#ffffff0a 1px,transparent 1px),linear-gradient(90deg,#ffffff0a 1px,transparent 1px);background-size:46px 46px;animation:gridPulse 10s ease-in-out infinite alternate}.ambient{position:fixed;width:40vw;height:40vw;border-radius:50%;filter:blur(95px);opacity:.15;background:#ff9d26;right:-10vw;top:-24vw;animation:glowDrift 12s ease-in-out infinite alternate}.deck{position:relative;width:100%;height:100%;display:grid;place-items:center;padding:30px}.slide{position:absolute;width:min(1220px,calc(100vw - 64px));height:min(690px,calc(100vh - 95px));padding:clamp(26px,4.8vw,70px);border:1px solid #ffffff1a;border-radius:26px;background:linear-gradient(145deg,#111a2ef5,#0a1020f5);box-shadow:0 30px 100px #0008;display:flex;flex-direction:column;justify-content:center;opacity:0;visibility:hidden;transform:translate(7%,2%) scale(.97);transition:opacity .4s,transform .6s cubic-bezier(.2,.8,.2,1),visibility .4s;overflow:hidden}.slide:after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 100% 0%,#ffb44117,transparent 35%)}.slide.active{opacity:1;visibility:visible;transform:none;animation:slideArrival .75s both}.slide.was-left{transform:translate(-7%,2%) scale(.97)}.eyebrow{position:relative;z-index:1;color:var(--gold);font-size:12px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;margin-bottom:18px;animation:riseIn .55s .08s both}.title{position:relative;z-index:1;font-family:Unbounded,Manrope,sans-serif;font-size:clamp(31px,5vw,65px);line-height:1.1;letter-spacing:-.045em;margin:0 0 18px}.accent{color:var(--gold);text-shadow:0 0 24px #ffae3733}.lead{position:relative;z-index:1;color:#c6cee0;font-size:clamp(16px,1.7vw,22px);line-height:1.52;max-width:900px;margin:0 0 20px}.grid{position:relative;z-index:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:12px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.four{grid-template-columns:repeat(4,minmax(0,1fr))}.card{border-top:1px solid #ffc04fa8;padding:15px 17px;background:linear-gradient(135deg,#ffffff12,#ffffff04);animation:cardLift .65s both;animation-delay:calc(var(--i,0)*.09s + .14s)}.card h3{margin:0 0 7px;color:var(--gold);font-size:clamp(15px,1.45vw,20px)}.card p{margin:0;color:#d0d6e5;font-size:clamp(13px,1.2vw,16px);line-height:1.48}.hero{justify-content:flex-start;padding-top:clamp(48px,8vh,86px)}.hero .title{max-width:1000px;font-size:clamp(36px,5.5vw,70px)}.hero .lead{max-width:630px}.hero-mark{position:absolute;right:8%;bottom:14%;width:min(28vw,300px);aspect-ratio:1;border:1px solid #ffc04f55;border-radius:50%;display:grid;place-items:center;color:var(--gold);font-size:clamp(74px,14vw,170px);text-shadow:0 0 60px #ffae3755;animation:orbitFloat 5s ease-in-out infinite}.hero-mark:before,.hero-mark:after{content:"";position:absolute;border:1px solid #ffc04f40;border-radius:50%;inset:12%;animation:ringExpand 4s ease-out infinite}.hero-mark:after{inset:-9%;animation-delay:2s}.chips,.sequence{position:relative;z-index:1;display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}.chip{border:1px solid #ffc04f66;color:#ffe0a1;border-radius:999px;padding:9px 13px;font-size:14px;font-weight:700;background:#ffbd4a12;animation:chipPop .5s both;animation-delay:calc(var(--i,0)*.07s + .2s)}.sequence{align-items:center;gap:8px}.step{padding:11px 13px;background:#ffffff0e;border-bottom:2px solid var(--gold);font-size:14px;color:#e5e9f1}.arrow{color:var(--gold);font-size:22px;animation:arrowPulse 1.4s infinite}.keygrid{position:relative;z-index:1;display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-top:12px}.key{padding:12px;border:1px solid #ffc04f66;border-radius:12px;background:linear-gradient(155deg,#ffc04f1f,#ffffff06);animation:keyFloat 3.6s ease-in-out infinite;animation-delay:calc(var(--i,0)*-.27s)}kbd{display:inline-block;color:#17120a;background:linear-gradient(#ffd988,#ffab37);border-radius:6px;padding:4px 8px;font-weight:900;font-size:14px;box-shadow:0 3px 0 #b96817;margin-right:3px}.key small{display:block;color:#cbd3e2;font-size:12px;margin-top:8px}.quote{position:relative;z-index:1;padding:20px 24px;margin-top:12px;border-left:3px solid var(--gold);background:#ffc04f12;font-size:clamp(15px,1.5vw,20px);line-height:1.55;color:#f3e7d1}.callout{position:relative;z-index:1;color:#16110a;background:linear-gradient(100deg,#ffd77c,#ff9d32);padding:12px 17px;font-weight:800;font-size:15px;display:inline-flex;align-self:flex-start;margin-top:17px;box-shadow:0 0 30px #ffac3233;animation:calloutGlow 2.7s infinite alternate}.visual{position:relative;z-index:1;margin-top:15px;min-height:142px;display:flex;align-items:center;justify-content:center;gap:12px}.screen{border:1px solid #ffc04f66;background:linear-gradient(145deg,#151f38,#0c1222);padding:17px 22px;min-width:175px;box-shadow:0 14px 40px #0005}.screen strong{color:var(--gold);font-size:16px}.screen span{display:block;color:#c3ccdd;margin-top:6px;font-size:13px}.bar{height:9px;background:linear-gradient(90deg,var(--amber),var(--gold));margin-top:9px;transform-origin:left;animation:barGrow 1.6s both}.bar:nth-child(2){animation-delay:.25s}.bar:nth-child(3){animation-delay:.5s}.notes{position:fixed;z-index:9;left:24px;bottom:75px;width:min(500px,calc(100vw - 48px));padding:15px 18px;background:#060a14f7;border:1px solid #ffc04f77;color:#d8deeb;line-height:1.5;font-size:14px;box-shadow:0 15px 50px #0009;opacity:0;transform:translateY(12px);pointer-events:none;transition:.25s}.notes.show{opacity:1;transform:none;pointer-events:auto}.notes b{display:block;color:var(--gold);margin-bottom:5px}.hud{position:fixed;z-index:10;left:0;right:0;bottom:0;height:62px;display:flex;align-items:center;gap:14px;padding:0 28px;background:linear-gradient(0deg,#050810f5,#050810b3);border-top:1px solid #ffffff14}.brand{font-size:12px;font-weight:800;letter-spacing:.13em;color:#d9dfeb}.progress{height:3px;flex:1;background:#263047;overflow:hidden}.progress i{display:block;height:100%;width:5%;background:linear-gradient(90deg,var(--amber),#ffe08a);transition:width .4s;box-shadow:0 0 12px #ffae3755}.count{font-variant-numeric:tabular-nums;color:#aab4c9;font-size:13px;min-width:58px;text-align:center}.controls{display:flex;gap:8px}.controls button{font:inherit;color:#f4f5f8;background:#151e32;border:1px solid #35405a;width:35px;height:35px;border-radius:50%;cursor:pointer;transition:.2s}.controls button:hover{color:#17120a;background:var(--gold);transform:translateY(-2px)}.hint{font-size:11px;color:#7e8aa2}.quiz-options{position:relative;z-index:1;display:flex;gap:11px;flex-wrap:wrap;margin-top:13px}.quiz-options button{font:700 15px Manrope;color:#e8edf6;background:#151f34;border:1px solid #394761;border-radius:11px;padding:12px 15px;cursor:pointer}.quiz-options button:hover{border-color:var(--gold);color:var(--gold)}.answer{position:relative;z-index:1;min-height:25px;color:var(--gold);font-weight:700;margin-top:10px}
@keyframes slideArrival{0%{filter:brightness(.7)}55%{filter:brightness(1.12)}100%{filter:brightness(1)}}@keyframes riseIn{from{opacity:0;transform:translateY(18px);letter-spacing:.35em}to{opacity:1;transform:none;letter-spacing:.2em}}@keyframes cardLift{0%{opacity:0;transform:translateY(24px) rotateX(9deg)}100%{opacity:1;transform:none}}@keyframes chipPop{0%{opacity:0;transform:scale(.7) translateY(10px)}75%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}@keyframes keyFloat{0%,100%{transform:translateY(0) rotate(-.4deg)}50%{transform:translateY(-7px) rotate(.4deg)}}@keyframes glowDrift{from{transform:translate(-5vw,0) scale(.9)}to{transform:translate(-2vw,8vh) scale(1.18)}}@keyframes gridPulse{from{opacity:.08;transform:translateY(0)}to{opacity:.2;transform:translateY(-8px)}}@keyframes orbitFloat{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-16px) rotate(5deg)}}@keyframes ringExpand{0%{transform:scale(.86);opacity:0}35%{opacity:.7}100%{transform:scale(1.12);opacity:0}}@keyframes arrowPulse{0%,100%{transform:translateX(0);opacity:.55}50%{transform:translateX(5px);opacity:1}}@keyframes calloutGlow{from{box-shadow:0 0 18px #ffac321f}to{box-shadow:0 0 38px #ffac326b}}@keyframes barGrow{from{transform:scaleX(0);opacity:.35}to{transform:scaleX(1);opacity:1}}@keyframes scan{0%{transform:translateY(-80px);opacity:0}20%{opacity:.8}100%{transform:translateY(150px);opacity:0}}@keyframes typing{from{width:0}to{width:100%}}@keyframes spark{0%{transform:scale(.2) rotate(0);opacity:0}40%{opacity:1}100%{transform:scale(1.4) rotate(90deg);opacity:0}}@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-3px)}40%,80%{transform:translateX(3px)}}
@media(max-width:760px){.deck{padding:10px}.slide{width:calc(100vw - 20px);height:calc(100vh - 76px);padding:24px 20px;border-radius:18px;overflow-y:auto;justify-content:flex-start}.title{font-size:clamp(28px,8vw,43px)}.hero .title{font-size:clamp(36px,10vw,58px)}.lead{font-size:16px}.grid,.grid.two,.grid.four{grid-template-columns:1fr 1fr;gap:8px}.card{padding:11px}.card p{font-size:13px}.keygrid{grid-template-columns:repeat(2,1fr);gap:8px}.hero-mark{opacity:.18;right:4%;bottom:17%;width:38vw}.hud{height:54px;padding:0 11px;gap:7px}.brand{font-size:9px}.hint{display:none}.controls{gap:4px}.controls button{width:31px;height:31px}.notes{left:11px;bottom:64px;width:calc(100vw - 22px)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style></head><body><div class="ambient"></div><main class="deck" id="deck"></main><aside class="notes" id="notes" aria-live="polite"></aside><nav class="hud"><div class="brand">DIGITAL / SKILLS</div><div class="progress"><i id="progress"></i></div><div class="count" id="count">01 / 20</div><div class="hint">← → листать · N заметки · F экран</div><div class="controls"><button id="prev" aria-label="Назад">←</button><button id="noteBtn" aria-label="Заметки">N</button><button id="next" aria-label="Вперёд">→</button></div></nav>
<script>
const slides=[
{type:'hero',tag:'Школьный технофестиваль · 2026',title:'Цифровые навыки<br>для учёбы,<br><span class="accent">проектов и будущего</span>',lead:'Не магия. Просто инструменты, которые возвращают время и дают больше свободы.',mark:'✳',notes:'Сегодня соберём цифровой набор, который пригодится уже на этой неделе. Выберите по ходу выступления один навык, который проверите на практике.'},
{tag:'Карта маршрута',title:'Семь суперсил — один цифровой набор',lead:'От быстрых действий на клавиатуре до собственного сайта.',chips:['⌨ Горячие клавиши','🛡 Кибербезопасность','🧭 Цифровая гигиена','✉ Почта','✦ ИИ-репетитор','▤ Опросы','▣ Сайт без кода'],callout:'Цель: делать полезное быстрее и безопаснее',notes:'Пойдём от повседневных инструментов к проектам. В каждом блоке будет короткий приём или задание.'},
{tag:'01 / Горячие клавиши',title:'Клавиатурные сочетания экономят клики',lead:'Запомни действие вместе с ситуацией — пальцы подхватят.',keys:[['Ctrl+C','Копировать текст или файл'],['Ctrl+V','Вставить содержимое'],['Ctrl+X','Вырезать для перемещения'],['Ctrl+Z','Отменить случайный хаос'],['Ctrl+A','Выделить всё в документе'],['Ctrl+F','Найти слово на странице'],['Alt+Tab','Переключиться между окнами'],['Win+Shift+S','Сделать фрагмент экрана']],notes:'Ctrl+F быстро находит нужное слово в длинном задании. Win+Shift+S удобно захватывает часть экрана, например условие задачи.'},
{tag:'Челлендж / 20 секунд',title:'Собери маршрут без мыши',lead:'Найди слово «проект», скопируй предложение и вставь в заметку. Какой порядок?',chips:['Ctrl+F → слово','Esc → выйти из поиска','Shift + стрелки → выбрать','Ctrl+C → копировать','Alt+Tab → другое окно','Ctrl+V → вставить'],callout:'Раунд 2: отменить вставку — Ctrl+Z',notes:'Предложите парам выполнить последовательность на учебном тексте или просто проговорить шаги. Сравните: какие сочетания уже знакомы, а какие новые?'},
{tag:'02 / Кибербезопасность',title:'Аккаунт защищают привычки, а не удача',lead:'Уникальный пароль + менеджер + второй фактор = крепче вход.',cards:[['Уникальность','Отдельный длинный пароль для каждого важного аккаунта. Не повторяй школьный пароль везде.'],['Менеджер паролей','Создаёт и хранит сложные пароли; защищай доступ сильным мастер-паролем.'],['2FA','Включи двухфакторную аутентификацию. Код подтверждения никому не пересылай.'],['Обновления','Обновляй систему и приложения: так закрываются известные уязвимости.']],callout:'Пароль — не загадка для одноклассников',notes:'Менеджер помогает не повторять пароли. Секретные коды и одноразовые подтверждения не сообщают даже «службе поддержки» в переписке.'},
{tag:'Детектив фишинга',title:'Найди красные флаги в сообщении',quote:'«СРОЧНО! Ваш школьный аккаунт заблокируют через 10 минут. Перейдите по bit.ly/… и отправьте пароль и код, чтобы восстановить доступ».',cards:[['⏱ Давление','Срочность и угроза блокировки мешают подумать.'],['🔗 Ссылка','Неожиданный короткий адрес? Не открывай; зайди на официальный сайт сам.'],['🔑 Секреты','Пароль и код нельзя передавать в ответ на письмо или чат.']],callout:'Пауза → проверить отправителя → зайти через официальный адрес',notes:'Дайте аудитории 10 секунд найти тревожные сигналы. Сообщение может выглядеть убедительно, а адрес отправителя — почти настоящим.'},
{tag:'03 / Цифровая гигиена',title:'Настройки — часть цифрового следа',lead:'То, что попало в сеть, может жить дольше одной публикации.',cards:[['Приватность','Проверь, кто видит профиль, публикации и список друзей.'],['Разрешения','Калькулятору обычно не нужна геолокация. Разрешай доступ по делу.'],['Личный след','Адрес, номер, расписание и билет с QR — не для открытого поста.'],['Общение','Пиши уважительно. За экраном всё равно человек.']],notes:'Настройки приватности стоит пересматривать после обновлений приложений. Перед публикацией спроси себя, готов ли увидеть это вне своей аудитории.'},
{tag:'Интерактив / голосуем',title:'Что не стоит выкладывать в открытый доступ?',lead:'Выбери два варианта. Объясни соседу: что может пойти не так?',chips:['Домашний адрес','Фото билета с QR','Расписание на неделю','Скрин переписки друга','Рисунок без личных данных'],callout:'Проверяй источники и делай паузы для глаз',notes:'Пусть ученики выберут два пункта. Билет с QR может содержать данные для входа, а чужую переписку нельзя публиковать без согласия.'},
{tag:'04 / Электронная почта',title:'Почтовый ящик: создай и сразу защити',sequence:['Выбрать сервис','Зарегистрировать адрес','Добавить восстановление','Включить 2FA','Проверить вход'],cards:[['Адрес','Для учёбы — понятное имя без лишних личных данных.'],['Защита','Уникальный пароль и резервный способ восстановления.'],['Письмо','Адресат → тема → приветствие → цель → вложение → подпись.']],callout:'Перед отправкой проверь адрес и файл',notes:'Выбирайте сервис, которым можно пользоваться и который подходит правилам школы или семьи. При регистрации укажите способ восстановления и настройте 2FA, если она доступна.'},
{tag:'Образец письма учителю',title:'Вежливо, коротко, понятно',quote:'Кому: ivanova@school.example<br>Тема: Вопрос по проекту по биологии<br><br>Здравствуйте, Анна Сергеевна!<br>Подскажите, пожалуйста, можно ли для проекта использовать опрос среди параллели? Черновик плана прикрепил(а).<br>Спасибо!<br>Мария, 10 «Б»',cards:[['Кому','Основной адресат'],['Копия','CC: видимые получатели для информации'],['Скрытая копия','BCC: адреса скрыты от остальных']],notes:'Выберите официальный адрес учителя и проверьте вложение. BCC подходит для рассылки, когда не нужно показывать всем адреса остальных.'},
{tag:'05 / ИИ как репетитор',title:'Хороший запрос задаёт рамки помощи',lead:'Назови цель, уровень и формат — получишь ответ, с которым можно учиться.',cards:[['Понять тему','«Объясни фотосинтез ученику 10 класса простыми словами. Дай аналогию и проверь понимание 3 вопросами».'],['План подготовки','«До контрольной 5 дней. Составь план по 25 минут в день по квадратным уравнениям».'],['Улучшить черновик','«Найди неясные места в абзаце. Не переписывай, задай вопросы для улучшения».']],callout:'Цель + уровень + формат ответа',notes:'Попросите ИИ объяснять ход решения и задавать встречные вопросы. Не передавайте личные данные и материалы, которые нельзя загружать по правилам школы.'},
{tag:'ИИ / проверяй и думай',title:'ИИ помогает, если работа остаётся твоей',grid2:[['Полезно','Объяснить непонятное, предложить тренировочные задачи, проверить логику черновика.'],['Рискованно','Скопировать ответ и сдать как свой: пробел в знаниях останется, ошибки могут быть незаметны.'],['Проверка','Сверь факты с учебником или надёжным источником. Уточни дату, формулы и цитаты.'],['Правило','Сначала попробуй сам. Используй ответ как подсказку, затем реши похожую задачу без ИИ.']],callout:'ИИ может ошибаться — проверка остаётся за тобой',notes:'Хороший репетитор помогает увидеть ход решения. Если сдать сгенерированный текст как свой, практики не будет.'},
{tag:'06 / Google Формы · занятие 1',title:'Опрос отвечает на вопрос проекта',lead:'Например: как десятиклассники выбирают музыку для концентрации?',cards:[['Один вариант','«Когда тебе легче учиться?» — выбрать один ответ.'],['Несколько вариантов','«Что помогает сосредоточиться?» — отметить всё подходящее.'],['Шкала','«Насколько шум мешает?» — оценка от 1 до 5.']],callout:'Коротко · понятно · без наводящих формулировок',notes:'Сначала сформулируйте исследовательский вопрос, потом пишите анкету. Каждый вопрос должен помогать ответить на исходный вопрос.'},

function content(d){let h='<div class="eyebrow">'+(d.tag||'')+'</div><h1 class="title">'+d.title+'</h1>';if(d.lead)h+='<p class="lead">'+d.lead+'</p>';if(d.keys)h+='<div class="keygrid">'+d.keys.map((x,j)=>'<div class="key" style="--i:'+j+'"><kbd>'+x[0]+'</kbd><small>'+x[1]+'</small></div>').join('')+'</div>';if(d.cards)h+='<div class="grid '+(d.cards.length===2?'two':'')+' '+(d.cards.length===4?'four':'')+'">'+d.cards.map((x,j)=>'<article class="card" style="--i:'+j+'"><h3>'+x[0]+'</h3><p>'+x[1]+'</p></article>').join('')+'</div>';if(d.grid2)h+='<div class="grid two">'+d.grid2.map((x,j)=>'<article class="card" style="--i:'+j+'"><h3>'+x[0]+'</h3><p>'+x[1]+'</p></article>').join('')+'</div>';if(d.chips)h+='<div class="chips">'+d.chips.map((x,j)=>'<span class="chip" style="--i:'+j+'">'+x+'</span>').join('')+'</div>';if(d.sequence)h+='<div class="sequence">'+d.sequence.map((x,j)=>(j?'<span class="arrow">›</span>':'')+'<span class="step">'+x+'</span>').join('')+'</div>';if(d.quote)h+='<div class="quote">'+d.quote+'</div>';if(d.visual==='chart')h+='<div class="visual"><div class="screen"><strong>Ответы опроса</strong><div class="bar" style="width:82%"></div><div class="bar" style="width:57%"></div><div class="bar" style="width:68%"></div></div><span class="arrow">→</span><div class="screen"><strong>Таблицы</strong><span>Сводка и диаграммы</span></div></div>';if(d.visual==='phone')h+='<div class="visual"><div class="screen" style="width:190px;border-radius:22px"><strong>Мой проект</strong><span>Короткое описание</span><div class="bar" style="width:88%"></div><span style="display:inline-block;margin-top:12px;padding:8px 12px;background:linear-gradient(90deg,#ff9a30,#ffd37b);color:#211400">Оставить заявку</span></div><div class="screen"><strong>Проверка формы</strong><span>1. Заполни сам</span><span>2. Нажми отправить</span><span>3. Проверь получение</span></div></div>';if(d.callout)h+='<div class="callout">'+d.callout+'</div>';if(d.mark)h+='<div class="hero-mark">'+d.mark+'</div>';if(d.quiz)h+='<div class="quiz-options"><button onclick="answer(0)">Нажать ссылку из срочного письма</button><button onclick="answer(1)">Отменить случайную вставку</button><button onclick="answer(2)">Оценить ответ по шкале 1–5</button></div><div class="answer" id="answer"></div>';return h}
slides.forEach((d,i)=>{const s=document.createElement('section');s.className='slide'+(i===0?' active hero':'');s.setAttribute('aria-label','Слайд '+(i+1));s.innerHTML=content(d);root.appendChild(s)});
let index=0,notesOn=false;const els=[...document.querySelectorAll('.slide')],notes=document.getElementById('notes');function show(n){const old=index;index=(n+els.length)%els.length;els.forEach((s,i)=>{s.classList.toggle('active',i===index);s.classList.toggle('was-left',i===old&&index<old)});document.getElementById('count').textContent=String(index+1).padStart(2,'0')+' / '+String(els.length).padStart(2,'0');document.getElementById('progress').style.width=((index+1)/els.length*100)+'%';notes.innerHTML='<b>Заметки докладчика · '+String(index+1).padStart(2,'0')+'</b>'+slides[index].notes;notes.classList.toggle('show',notesOn)}function answer(n){const a=document.getElementById('answer');a.textContent=n===1?'Верно: Ctrl+Z отменяет последнее действие.':'Подсказка: какое сочетание отменяет последнее действие?';a.style.animation='shake .35s'}
document.getElementById('prev').onclick=()=>show(index-1);document.getElementById('next').onclick=()=>show(index+1);document.getElementById('noteBtn').onclick=()=>{notesOn=!notesOn;show(index)};document.addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();show(index+1)}else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(index-1)}else if(e.key==='Home')show(0);else if(e.key==='End')show(els.length-1);else if(e.key.toLowerCase()==='n'){notesOn=!notesOn;show(index)}else if(e.key.toLowerCase()==='f'){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()}else if(e.key==='Escape'){notesOn=false;show(index)}});let touchX=0;document.addEventListener('touchstart',e=>touchX=e.changedTouches[0].screenX,{passive:true});document.addEventListener('touchend',e=>{let dx=e.changedTouches[0].screenX-touchX;if(Math.abs(dx)>70)show(index+(dx<0?1:-1))},{passive:true});show(0);
